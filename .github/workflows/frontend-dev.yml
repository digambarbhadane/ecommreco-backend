name: Frontend DEV Deploy

on:
  push:
    branches:
      - ecommreco_dev

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend DEV
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "===== FRONTEND DEV ====="

            cd /home/ubuntu/ecommreco_dev/ecommreco-frontend

            git fetch origin
            git checkout ecommreco_dev
            git reset --hard origin/ecommreco_dev

            npm install

            npm run build:dev

            sudo systemctl reload nginx

            echo "Frontend DEV deployed."