name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommreco-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommreco-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          USE_MEMORY_DB: "true"
          JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
          SUPER_ADMIN_SETUP_TOKEN: ci-setup-token

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommreco-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommreco-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:production
