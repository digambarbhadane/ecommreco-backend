name: Backend TEST Deploy

on:
  push:
    branches:
      - ecommreco_test

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend TEST
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "===== BACKEND TEST ====="

            cd /home/ubuntu/ecommreco_test/ecommreco-backend

            git fetch origin
            git checkout ecommreco_test
            git reset --hard origin/ecommreco_test

            npm install

            npm run build

            pm2 restart api-test

            pm2 save

            echo "Backend TEST deployed."