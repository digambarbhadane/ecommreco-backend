# Large marketplace report uploads (Flipkart / Amazon / Meesho / Myntra).
# Include inside the server { } block for api-dev / api-uat / api production hosts.
#
# Apply on EC2:
#   sudo cp deploy/nginx/snippets/upload-limits.conf /etc/nginx/snippets/ecommreco-upload-limits.conf
#   # Add inside server block: include snippets/ecommreco-upload-limits.conf;
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 100m;
client_body_timeout 600s;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_connect_timeout 60s;
proxy_request_buffering off;
