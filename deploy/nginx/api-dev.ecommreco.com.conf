# Nginx site for api-dev.ecommreco.com (EC2 / Ubuntu).
# Without client_max_body_size, nginx defaults to 1m and large Flipkart uploads return 413.
#
# Install:
#   sudo cp deploy/nginx/api-dev.ecommreco.com.conf /etc/nginx/sites-available/api-dev.ecommreco.com
#   sudo ln -sf /etc/nginx/sites-available/api-dev.ecommreco.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL paths below are placeholders — use certbot or your existing certificate paths.

upstream ecommreco_api_dev {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name api-dev.ecommreco.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-dev.ecommreco.com;

    # Replace with your Let's Encrypt / certificate paths on the server.
    ssl_certificate     /etc/letsencrypt/live/api-dev.ecommreco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.ecommreco.com/privkey.pem;

    include /etc/nginx/snippets/ecommreco-upload-limits.conf;

    location / {
        proxy_pass http://ecommreco_api_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
